[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modem-emu"
version = "0.1.0"
description = "Firmware emulators for many modem families (USRobotics, ZyXEL, Telebit, Hayes, Microcom)"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
execute = ["unicorn>=2.1.4"]
courier = ["courier-emu @ git+https://github.com/D-Modem/courier-emu"]
hayes = ["z80>=1.2"]
test = ["pytest>=8"]

[project.scripts]
modem-emu = "modem_emu.cli:main"

[tool.setuptools.packages.find]
include = ["modem_emu*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"modem_emu.families.hayes" = ["adc_vectors.json"]
